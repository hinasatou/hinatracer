name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Allow unprivileged ICMP (best-effort)
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647" || true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  build:
    needs: test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, platform: "windows/amd64", artifact: "windows-amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64", artifact: "linux-amd64" }
          - { name: macOS, os: macos-latest, platform: "darwin/amd64,darwin/arm64", artifact: "macos" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build with mygo
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' mygo.json | head -n1)"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "could not determine version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging version v${VERSION}"
          mkdir -p dist

      - name: Package Windows
        if: matrix.artifact == 'windows-amd64'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "hinatracer-win-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\windows-amd64\HinaTracer.exe $stage
          Copy-Item LICENSE, README.md $stage
          $zip = Join-Path (Resolve-Path dist) "HinaTracer-v$env:VERSION-windows-amd64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Remove-Item -Recurse -Force $stage
          $setup = Get-ChildItem -Path build\windows-amd64 -Filter 'HinaTracer Setup *.exe' | Select-Object -First 1
          if (-not $setup) { throw "missing NSIS installer 'HinaTracer Setup <ver>.exe' from mygo build" }
          Copy-Item $setup.FullName (Join-Path (Resolve-Path dist) "HinaTracer-v$env:VERSION-windows-amd64-setup.exe")
          Get-ChildItem dist

      - name: Package Linux
        if: matrix.artifact == 'linux-amd64'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp build/linux-amd64/hinatracer "$stage/"
          cp build/linux-amd64/hinatracer.desktop "$stage/"
          cp build/linux-amd64/hinatracer.png "$stage/"
          cp LICENSE README.md "$stage/"
          tar -C "$stage" -czf "dist/HinaTracer-v${VERSION}-linux-amd64.tar.gz" .
          rm -rf "$stage"
          deb="$(echo build/linux-amd64/hinatracer_*_amd64.deb)"
          if [[ ! -f "$deb" ]]; then
            echo "missing .deb from mygo build" >&2
            exit 1
          fi
          cp "$deb" "dist/HinaTracer-v${VERSION}-linux-amd64.deb"
          # Plain CGO-free binary (useful for containers / manual install)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w"             -o "dist/HinaTracer-v${VERSION}-linux-amd64" .
          # Headless server .deb (systemd unit, CAP_NET_RAW, no desktop GUI)
          bash scripts/build-server-deb.sh "$VERSION" dist
          ls -la dist/

      - name: Package macOS
        if: matrix.artifact == 'macos'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            app="build/darwin-${arch}/HinaTracer.app"
            if [[ ! -d "$app" ]]; then
              echo "missing $app" >&2
              exit 1
            fi
            zip="dist/HinaTracer-v${VERSION}-macos-${arch}.zip"
            ditto -c -k --keepParent "$app" "$zip"
            zip -j "$zip" LICENSE README.md
            # DMG installer: the app plus a link to /Applications to drag onto.
            # The zip above stays: the built-in updater downloads it.
            stage="$(mktemp -d)"
            ditto "$app" "$stage/HinaTracer.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname HinaTracer -srcfolder "$stage" -ov -format UDZO \
              "dist/HinaTracer-v${VERSION}-macos-${arch}.dmg"
            rm -rf "$stage"
          done
          ls -la dist/

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hinatracer-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # One release run per tag at a time: a newer run cancels an older one,
    # so two runs never upload into the same release.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check the tag still points at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Resolve the tag (annotated tags point at a tag object first).
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          type="$(jq -r .object.type <<<"$ref")"
          sha="$(jq -r .object.sha <<<"$ref")"
          if [[ "$type" == "tag" ]]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)"
          fi
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG now points at $sha, but this run built $GITHUB_SHA (a stale re-run?). Refusing to touch the release."
            exit 1
          fi
          echo "Tag $TAG -> $sha matches this run."

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or reset the draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cd release-assets
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ "$f" != "./$base" ]]; then
              mv -f "$f" "./$base"
            fi
          done
          find . -type d -empty -delete || true
          rm -f SHA256SUMS.txt
          sha256sum HinaTracer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $TAG is already published. Refusing to change its assets; delete it or use a new tag."
              exit 1
            fi
            echo "Draft release $TAG exists: removing its old assets first"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                [[ -n "$name" ]] || continue
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              done
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" HinaTracer-* SHA256SUMS.txt

      - name: Verify the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -la
          # every file listed must match, and nothing unlisted may be there
          sha256sum -c SHA256SUMS.txt
          listed="$(awk '{print $2}' SHA256SUMS.txt | sed 's/^\*//' | sort)"
          present="$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)"
          if [[ "$listed" != "$present" ]]; then
            echo "::error::Release assets and SHA256SUMS.txt differ:"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          # and the sums must be the ones this run computed
          cmp SHA256SUMS.txt ../release-assets/SHA256SUMS.txt
          echo "All $(wc -l < SHA256SUMS.txt) assets verified."
